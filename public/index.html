<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#c9a26c" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>情绪账本</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 页面 1：记录 -->
    <section class="page" id="pageRecord">
      <header class="topbar">
        <div class="topbar-title">情绪账本</div>
        <div class="topbar-sub" id="recordSub">给每一种心情，留个位置</div>
      </header>

      <!-- 快速记录（默认展开）：情绪选择 + 描述 -->
      <section class="card record-card">
        <div class="card-title">此刻心情如何？</div>
        <div class="mood-picker" id="moodPicker">
          <details class="mood-group" data-cat="positive" open>
            <summary><span class="dot pos"></span>积极 <span class="grp-count" id="cntPositive"></span></summary>
            <div class="mood-grid" data-grid="positive"></div>
          </details>
          <details class="mood-group" data-cat="neutral">
            <summary><span class="dot neu"></span>中性 <span class="grp-count" id="cntNeutral"></span></summary>
            <div class="mood-grid" data-grid="neutral"></div>
          </details>
          <details class="mood-group" data-cat="negative">
            <summary><span class="dot neg"></span>消极 <span class="grp-count" id="cntNegative"></span></summary>
            <div class="mood-grid" data-grid="negative"></div>
          </details>
        </div>
        <div class="desc-row">
          <textarea id="moodDesc" placeholder="发生了什么？（可不填）" maxlength="500" rows="2"></textarea>
        </div>
        <div class="time-pick">
          <span class="time-hint" id="timeHint">记录时间：现在</span>
          <button type="button" class="time-link" id="timeEditBtn">自选时间</button>
        </div>
        <input type="datetime-local" id="customTime" class="field-time" hidden />
        <div class="record-actions">
          <button class="btn-ghost" id="todayCardBtn" type="button">今日卡</button>
          <button class="btn-primary" id="saveMoodBtn" type="button">记下来 ✎</button>
        </div>
      </section>

      <!-- 历史记录（默认折叠） -->
      <button class="history-toggle" id="historyToggle" type="button" aria-expanded="false">
        <span>历史记录 <span id="historyCount" class="history-count">0</span></span>
        <span class="chevron" id="historyChevron">▾</span>
      </button>
      <div class="history-wrap" id="historyWrap" hidden>
        <div class="view-seg" id="viewSeg">
          <button type="button" data-view="group" class="active">按日期</button>
          <button type="button" data-view="timeline">时间线</button>
        </div>
        <div id="historyList"></div>
        <div class="empty" id="historyEmpty" hidden>还没有记录，点上面的「记下来」开始吧</div>
      </div>
    </section>

    <!-- 页面 2：统计 -->
    <section class="page" id="pageStats" hidden>
      <header class="topbar">
        <div class="topbar-title">情绪分布</div>
        <div class="topbar-sub">点一行看这类心情的具体记录</div>
      </header>
      <section class="card stats-card">
        <div class="range-bar">
          <div class="seg" id="rangeSeg">
            <button type="button" data-range="day">日</button>
            <button type="button" data-range="week">周</button>
            <button type="button" data-range="month" class="active">月</button>
            <button type="button" data-range="year">年</button>
          </div>
          <input type="month" id="rangePicker" class="range-picker" />
          <select id="rangeYear" class="range-picker" hidden></select>
        </div>
        <div class="card-head">
          <span class="card-title" id="statsRangeLabel">本月 · 占比</span>
          <span class="stats-total" id="statsTotal">共 0 条</span>
        </div>
        <div id="statsList"></div>
        <div class="empty" id="statsEmpty" hidden>该时间段还没有数据</div>
        <button class="btn-export" id="exportStatsBtn" type="button">导出图片</button>
      </section>
    </section>

    <!-- 页面 3：明细（点统计里的情绪进入） -->
    <section class="page" id="pageDetail" hidden>
      <header class="topbar detail-topbar">
        <button class="back-btn" id="detailBack" type="button">‹ 返回</button>
        <div class="topbar-title" id="detailTitle">明细</div>
      </header>
      <section class="card detail-summary">
        <span id="detailMoodEmoji" class="detail-emoji">🙂</span>
        <span id="detailMoodName" class="detail-name">心情</span>
        <span id="detailMoodPct" class="detail-pct"></span>
      </section>
      <div id="detailList"></div>
    </section>

    <!-- 页面 4：我的 -->
    <section class="page" id="pageMine" hidden>
      <header class="topbar">
        <div class="topbar-title">我的</div>
      </header>
      <section class="card">
        <div class="card-title">数据备份</div>
        <p class="backup-tip">数据只存在这台手机上。建议定期导出，换手机或误删时导入恢复。</p>
        <div class="backup-actions">
          <button class="btn-primary" id="exportBtn" type="button">导出备份</button>
          <button class="btn-ghost" id="importBtn" type="button">导入备份</button>
          <button class="btn-ghost" id="exportMdBtn" type="button">导出 Markdown</button>
          <input type="file" id="importInput" accept="application/json,.json" hidden />
        </div>
      </section>
      <section class="card">
        <div class="card-title">我的收藏 <span class="fav-count" id="favCount">0</span></div>
        <div id="favList"></div>
        <div class="empty" id="favEmpty" hidden>还没有收藏，在记录里点 ☆ 收藏一条吧</div>
      </section>
      <section class="card">
        <div class="card-title">那年今日</div>
        <div id="onThisDayList"></div>
        <div class="empty" id="onThisDayEmpty" hidden>往年今天还没有记录</div>
      </section>
      <section class="card">
        <div class="card-title">关于</div>
        <p class="backup-tip">情绪账本 · 纯离线、不联网、不上传。每条记录自动保存当时的年月日与时分。</p>
      </section>
    </section>

    <!-- 底部导航 -->
    <nav class="tabbar">
      <button class="tab active" data-page="record" type="button">
        <span class="tab-ico">📖</span><span>记录</span>
      </button>
      <button class="tab" data-page="stats" type="button">
        <span class="tab-ico">📊</span><span>统计</span>
      </button>
      <button class="tab-add" id="tabAdd" type="button" title="记一笔">＋</button>
      <button class="tab" data-page="detail" type="button" id="tabDetail" disabled>
        <span class="tab-ico">🔍</span><span>明细</span>
      </button>
      <button class="tab" data-page="mine" type="button">
        <span class="tab-ico">👤</span><span>我的</span>
      </button>
    </nav>
  </div>

  <!-- 编辑弹层 -->
  <div class="modal" id="editModal" hidden>
    <div class="modal-box">
      <div class="modal-title">编辑记录</div>
      <label class="field-label">情绪</label>
      <select id="editMood" class="field-select"></select>
      <label class="field-label">事件描述</label>
      <textarea id="editDesc" maxlength="500" rows="3" placeholder="发生了什么？（可不填）"></textarea>
      <label class="field-label">时间</label>
      <input type="datetime-local" id="editTime" class="field-time" />
      <div class="modal-actions">
        <button class="btn-ghost" id="editCancel" type="button">取消</button>
        <button class="btn-primary" id="editSave" type="button">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- 删除确认弹窗 -->
  <div class="modal" id="confirmModal" hidden>
    <div class="modal-box confirm-box">
      <div class="modal-title">删除这条记录？</div>
      <p class="confirm-tip">删除后无法恢复（不会进回收站）。</p>
      <div class="modal-actions">
        <button class="btn-ghost" id="confirmCancel" type="button">取消</button>
        <button class="btn-danger" id="confirmOk" type="button">删除</button>
      </div>
    </div>
  </div>

  <!-- 图片预览弹窗（今日卡 / 统计导出） -->
  <div class="modal" id="imgModal" hidden>
    <div class="modal-box img-modal">
      <div class="modal-title" id="imgModalTitle">心情卡片</div>
      <div class="img-preview-wrap"><img id="imgPreview" alt="预览" /></div>
      <p class="img-tip">长按图片可保存到相册；或点下方按钮下载</p>
      <div class="modal-actions">
        <button class="btn-ghost" id="imgClose" type="button">关闭</button>
        <button class="btn-primary" id="imgSave" type="button">保存图片</button>
      </div>
    </div>
  </div>

  <script src="src/storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
